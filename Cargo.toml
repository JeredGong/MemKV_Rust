[package]
name = "kvs"
version = "0.1.0"
authors = ["Jered Gong"]
description = "A key-value store"
edition = "2018"

[dependencies]
bytes = "1.11.0"
clap = "2.32.0"
structopt = "0.2.15"
crc32fast = "1.5.0"
env_logger = "0.6.1"
log = "0.4.29"
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
rayon = "1.0.3"
sled = "0.34.6"

[dev-dependencies]
assert_cmd = "0.11"
criterion = "0.2.11"
crossbeam-utils = "0.6.5"
predicates = "1.0.0"
rand = "0.6.5"
tempfile = "3.0.7"
walkdir = "2.2.7"
panic-control = "0.1.4"